{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex w-full bg-gray-50 font-sans">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-6 shrink-0 min-h-[calc(100vh-70px)]">
        <div>
            <h1 class="text-xl font-semibold mb-10 text-gray-800 italic">Painel de Usuário</h1>
            
            <nav class="space-y-4">
                <a href="#" class="flex items-center space-x-3 text-gray-600 hover:text-purple-600 px-2 py-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>Meu Perfil</span>
                </a>
                
                <div class="border-t border-gray-100 pt-4">
                    <a href="#" class="flex items-center space-x-3 bg-purple-400 text-white rounded-full px-4 py-2 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                        <span class="font-medium">Gerenciar Projetos</span>
                    </a>
                </div>

                <a href="#" class="flex items-center space-x-3 text-gray-600 hover:text-purple-600 px-2 py-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span>Favoritos</span>
                </a>

                <div class="border-t border-gray-100 pt-4">
                    <a href="#" class="flex items-center space-x-3 text-gray-600 hover:text-purple-600 px-2 py-1 border-b border-gray-100 pb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                        <span>Submissões</span>
                    </a>
                </div>
            </nav>
        </div>

        <div class="border-t border-gray-100 pt-4">
            <a href="#" class="flex items-center space-x-3 text-gray-600 hover:text-gray-900 px-2 py-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="font-medium">Configurações</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 p-10">
        <div class="max-w-4xl mx-auto">
            
            <nav class="text-sm text-gray-500 mb-6 flex items-center space-x-2">
                <span>Início</span>
                <span>&rsaquo;</span>
                <span>Painel de Controle</span>
                <span>&rsaquo;</span>
                <span>Gerenciar Projetos</span>
                <span>&rsaquo;</span>
                <span class="text-green-600 font-semibold">Editar Projetos</span>
            </nav>

            <hr class="border-dotted border-gray-300 mb-8">

            <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-8 flex flex-col">
                <h2 class="text-2xl font-bold text-gray-800 mb-1">Editar projeto</h2>
                <hr class="mb-8 border-gray-300">

                <form class="space-y-6">
                    <div>
                        <label class="block font-bold text-gray-800 mb-1">Resumo</label>
                        <textarea rows="3" class="w-full border border-gray-400 p-2 rounded focus:outline-none focus:ring-1 focus:ring-gray-400 text-sm"> Repositório de PDS Lorem ipsum dolor sit amet, consectetur adipisicing elit. Repellendus, soluta nobis. Esse voluptatem optio vel sunt, sapiente dolorum obcaecati temporibus, officia aspernatur laudantium rem labore officiis iusto doloribus, nam omnis.</textarea>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-800 mb-1">Descrição</label>
                        <input type="text" value="Web" class="w-full border border-gray-400 p-2 rounded">
                    </div>

                    <div>
                        <label class="block font-bold text-gray-800 mb-1">Ferramentas utilizadas</label>
                        <input type="text" value="Django, vscode, figma" class="w-full border border-gray-400 p-2 rounded">
                    </div>

                    <div>
                        <label class="block font-bold text-gray-800 mb-1">Repositório</label>
                        <input type="text" value="https://github.com/tadsxandria/" class="w-full border border-gray-400 p-2 rounded">
                    </div>

                    <div>
                        <label class="block font-bold text-gray-800 mb-1">Status</label>
                        <select class="border border-gray-400 p-2 rounded bg-white text-sm focus:outline-none focus:ring-1 focus:ring-gray-400">
                            <option value="em_andamento">Em andamento</option>
                            <option value="finalizado">Finalizado</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-800 mb-1">Imagem</label>
                        <div class="flex items-start space-x-8">
                            <button type="button" class="bg-[#5a189a] text-white text-xs font-bold py-2 px-4 rounded shadow-sm hover:bg-[#480ca8]">
                                Anexar imagem
                            </button>
                            <div class="w-48 h-32 border border-gray-400 rounded bg-white"></div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mt-12">
                        <button type="button" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-8 rounded-xl transition">
                            <span>Avançar</span>
                        </button>

                        <button type="button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-8 rounded-xl transition">
                            <span>Cancelar</span>
                        </button>

                        <button type="button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-8 rounded-xl transition">
                            <span>Salvar mudanças</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
{% endblock %}
