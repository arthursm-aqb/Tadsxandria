{% extends "base_cadastro.html" %}
{% load static %}

{% block title %}Cadastro de Conta{% endblock %}

{% block content %}

<div class="flex flex-col md:flex-row min-h-screen font-share overflow-x-hidden">

    <!-- LADO ESQUERDO -->
    <div class="w-full md:w-1/2 flex flex-col justify-between p-6 md:p-8 bg-gradient-to-b from-[#4A00B4] to-[#701783] relative">

        <header class="pl-2 md:pl-8">

            <figure>
                <a href="{% url 'index' %}"><img src="{% static 'img/seta.svg' %}" class="w-10 h-10 md:w-12 md:h-12"></a>
            </figure>

            <img src="{% static 'img/torre.svg' %}" class="w-10 h-10 md:w-14 md:h-14 absolute top-[120px] md:top-[170px] left-[180px] md:left-[304px]">

            <h1 class="font-share font-bold text-[35px] md:text-[50px] text-white pt-24 md:pt-32 leading-tight">BEM-VINDO(A) <br>FAÇA SEU LOGIN <br>OU CADASTRE-SE</h1>

        </header>

        <footer class="pl-2 md:pl-8 mt-10 md:mt-0">
            <p class="font-orbitron font-semibold text-white">TADSXANDRIA BIBLIOTECA</p>
        </footer>

    </div>

    <!-- LADO DIREITO -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-6 md:p-8 bg-[#FFFFFB]">

        <section class="w-full max-w-[600px] flex items-center justify-center border border-black bg-white px-6 md:px-10 py-8 md:py-10 rounded-3xl shadow-md">

            {% include "app/formulario_conta.html" %}

        </section>

    </div>

</div>

{% endblock %}
